name: CI & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (tests only, no publish)'
        type: boolean
        default: false
      tag:
        description: 'Existing tag to (re)publish, e.g. v2.1.0. Empty = behave like a normal CI run.'
        type: string
        default: ''

permissions:
  contents: write   # push release commits/tags & create GitHub releases
  id-token: write   # npm provenance

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax-check all JS files
        run: |
          fails=0
          for f in $(git ls-files '*.js'); do
            node --check "$f" || fails=$((fails+1))
          done
          exit $fails

      - name: CLI smoke tests (no deps needed)
        run: |
          node cli.js --version
          node cli.js --help > /dev/null

      - name: Install dependencies
        run: npm install --no-audit --no-fund
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: API smoke test
        run: |
          node -e "const ptg = require('./index.js'); for (const k of ['getTokenInteractive','getTokenHeadless','loginInteractive','loginHeadless']) { if (typeof ptg[k] !== 'function') throw new Error('missing export: ' + k); } console.log('exports OK:', Object.keys(ptg).filter(k => k !== 'default').join(', '));"

  auto:
    name: Detect & cut release
    needs: test
    runs-on: ubuntu-latest
    if: >-
      !cancelled() &&
      needs.test.result == 'success' &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && inputs.tag == '' && inputs.dry_run == false)
      )
    outputs:
      tag: ${{ steps.cut.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Detect release-worthy commits (conventional commits)
        id: detect
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then RANGE="${LAST_TAG}..HEAD"; else RANGE="HEAD"; fi
          echo "Analysing range: ${RANGE:-empty}"

          MAJOR=0
          MINOR=0
          PATCH=0
          re_major='^[a-zA-Z]+([(][^)]*[)])?!:'
          re_minor='^feat([(][^)]*[)])?:'
          re_patch='^(fix|perf|revert)([(][^)]*[)])?:'
          while IFS= read -r subject; do
            echo "  commit: $subject"
            if [[ "$subject" =~ $re_major ]]; then MAJOR=1; fi
            if [[ "$subject" =~ $re_minor ]]; then MINOR=1; fi
            if [[ "$subject" =~ $re_patch ]]; then PATCH=1; fi
          done < <(git log --format=%s "$RANGE")

          if git log --format=%B "$RANGE" | grep -q '^BREAKING CHANGE'; then MAJOR=1; fi

          if [ "$MAJOR" -eq 1 ]; then BUMP=major
          elif [ "$MINOR" -eq 1 ]; then BUMP=minor
          elif [ "$PATCH" -eq 1 ]; then BUMP=patch
          else BUMP=""; fi

          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
          echo "Version bump decision: ${BUMP:-none (no release-worthy commits)}"

      - name: Guard - HEAD must still be the tip of origin/main
        run: |
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "::notice::Newer commits exist on origin/main; letting the next run handle the release."
            exit 1
          fi

      - name: Bump version, cut tag, push
        id: cut
        if: steps.detect.outputs.bump != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          npm version "${{ steps.detect.outputs.bump }}" --no-git-tag-version > /dev/null
          NEW_VERSION=$(node -p "require('./package.json').version")

          if git ls-remote --exit-code --tags origin "refs/tags/v$NEW_VERSION" > /dev/null 2>&1; then
            echo "Tag v$NEW_VERSION already exists - reusing it for publish."
            echo "tag=v$NEW_VERSION" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git add package.json
          git commit -m "chore(release): v$NEW_VERSION"
          git tag -a "v$NEW_VERSION" -m "v$NEW_VERSION"
          git push origin HEAD:main
          git push origin "v$NEW_VERSION"

          echo "tag=v$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "Cut release v$NEW_VERSION"

      - name: No release needed
        if: steps.detect.outputs.bump == ''
        run: echo "::notice::Only non-release commits (docs/chore/ci/test/...) since last tag - skipping release."

  release:
    name: Publish to npm & GitHub Release
    needs: [test, auto]
    runs-on: ubuntu-latest
    if: >-
      !cancelled() &&
      needs.test.result == 'success' &&
      (
        startsWith(github.ref, 'refs/tags/v') ||
        (github.event_name == 'workflow_dispatch' && inputs.tag != '') ||
        needs.auto.outputs.tag != ''
      ) &&
      !(github.event_name == 'workflow_dispatch' && inputs.dry_run == true)
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || needs.auto.outputs.tag || github.ref }}
          fetch-depth: 0   # full history for changelog generation

      - name: Resolve tag
        id: tag
        run: echo "tag=${{ inputs.tag || needs.auto.outputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - name: Verify tag matches package.json version
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          TAG_VERSION="${TAG#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag ${TAG} != package.json $PKG_VERSION"
            exit 1
          fi
          echo "Releasing $PKG_VERSION"

      - name: Update npm (trusted publishing needs npm >= 11.5.1)
        run: npm install -g npm@latest

      - name: Publish to npm (trusted publishing - no token needed)
        run: npm publish --provenance --access public

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          PREV=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || git rev-list --max-parents=0 HEAD | head -1)
          {
            echo "## Changes"
            echo
            git log --pretty=format:'- %s (%h)' "${PREV}..${TAG}" | grep -v -- '- chore(release)' || true
            echo
          } > RELEASE_NOTES.md
          gh release create "$TAG" --title "$TAG" --notes-file RELEASE_NOTES.md \
            || gh release edit "$TAG" --title "$TAG" --notes-file RELEASE_NOTES.md
