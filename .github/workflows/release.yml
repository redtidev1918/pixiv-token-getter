name: CI & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (tests only, no publish)'
        type: boolean
        default: false

permissions:
  contents: write   # create GitHub releases
  id-token: write   # npm provenance

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax-check all JS files
        run: |
          fails=0
          for f in $(git ls-files '*.js'); do
            node --check "$f" || fails=$((fails+1))
          done
          exit $fails

      - name: CLI smoke tests (no deps needed)
        run: |
          node cli.js --version
          node cli.js --help > /dev/null

      - name: Install dependencies
        run: npm install --no-audit --no-fund
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: API smoke test
        run: |
          node -e "const ptg = require('./index.js'); for (const k of ['getTokenInteractive','getTokenHeadless','loginInteractive','loginHeadless']) { if (typeof ptg[k] !== 'function') throw new Error('missing export: ' + k); } console.log('exports OK:', Object.keys(ptg).filter(k => k !== 'default').join(', '));"

  release:
    name: Publish to npm & GitHub Release
    needs: test
    runs-on: ubuntu-latest
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      !(github.event_name == 'workflow_dispatch' && inputs.dry_run == true)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for changelog generation

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION != package.json $PKG_VERSION"
            exit 1
          fi
          echo "Releasing $PKG_VERSION"

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          PREV=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || git rev-list --max-parents=0 HEAD | head -1)
          {
            echo "## Changes"
            echo
            git log --pretty=format:'- %s (%h)' "${PREV}..${TAG}"
            echo
          } > RELEASE_NOTES.md
          gh release create "$TAG" --title "$TAG" --notes-file RELEASE_NOTES.md
